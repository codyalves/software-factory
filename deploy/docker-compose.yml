# Local stack: docker compose -f deploy/docker-compose.yml --env-file .env up --build
# Redis and MinIO are wired now and used from M1 (rate limits, locks, artifacts).

name: software-factory

x-database-url: &database-url postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: factory
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-too}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { ENTRY: apps/api/src/server.ts } }
    environment:
      DATABASE_URL: *database-url
      MIGRATE_ON_STARTUP: "true"
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  orchestrator:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { ENTRY: apps/orchestrator/src/main.ts } }
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }

  workers:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { ENTRY: apps/workers/src/main.ts } }
    environment:
      DATABASE_URL: *database-url
      # Without it the worker runs but leaves triage steps queued.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
