version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["@biomejs/*", "@types/*", "typescript", "vitest"]
      # playwright and @playwright/test must move together: with one bumped
      # alone, the tester's repro tests cannot run (seen in #33 and #34).
      playwright:
        patterns: ["playwright", "@playwright/*", "@axe-core/playwright"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
