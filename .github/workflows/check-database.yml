name: check-database

# Checks the persistent factory database: applies pending migrations, verifies
# the audit chain, counts what is stored, and checks the dashboard's read-only
# role. No API calls, no cost. Run by hand after setting FACTORY_DATABASE_URL.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.FACTORY_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Require the secret
        if: env.DATABASE_URL == ''
        run: |
          echo "FACTORY_DATABASE_URL secret is not set (see docs/hosting.md)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          set -o pipefail
          node apps/workers/src/check-database.ts | tee -a "$GITHUB_STEP_SUMMARY"
