name: check-github-app

# Confirms the factory's GitHub App secrets work, without changing anything
# and without calling the Claude API: signs an app JWT, finds the
# installation on each repository and gets a token. Run by hand.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Repositories to check, space-separated
        default: codyalves/software-factory codyalves/factory-target-app
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_APP_ID: ${{ secrets.FACTORY_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check each repository
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          status=0
          for repo in $REPOS; do
            node apps/orchestrator/src/check-github-app.ts "$repo" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=1
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
