name: live-triage

# Calls the real Claude API, so it only runs when started by hand:
# Actions tab -> live-triage -> Run workflow. Never runs on push or PR.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to triage with
        default: claude-haiku-5-5
        required: true

permissions:
  contents: read

jobs:
  live-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRIAGE_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Require the API key
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "ANTHROPIC_API_KEY secret is not set." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Triage sample issues with Claude
        run: node apps/workers/src/live-triage.ts | tee -a "$GITHUB_STEP_SUMMARY"
