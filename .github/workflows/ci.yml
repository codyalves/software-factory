name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is a required status check in branch protection; keep it stable.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Type-check
        run: pnpm typecheck

      - name: Test (unit + Postgres integration)
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
        env:
          FACTORY_TEST_DB: postgres://factory:factory@localhost:5432/factory

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker compose file
        run: GITHUB_WEBHOOK_SECRET=ci docker compose -f deploy/docker-compose.yml config --quiet

      - name: Build the service image
        run: docker build -f deploy/Dockerfile --build-arg ENTRY=apps/api/src/server.ts -t factory-api .
